services:
  postgres:
    image: pgvector/pgvector:pg18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: openforge
      POSTGRES_USER: openforge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openforge:${DB_PASSWORD}@postgres/openforge
      REDIS_URL: redis://redis:6379
    volumes:
      - filedata:/app/data/files

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://server:3000

volumes:
  pgdata:
  redisdata:
  filedata:
